name: Installer test

# Installs a release's installers on clean machines and runs the smoke test
# (start, centred sign-in gate, signed-out refusal, live update feed, live
# sign-in start, screenshot on Windows, 30s stability, clean quit), then
# uninstalls. Run before publishing a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (draft or published), e.g. v1.8.2"
        required: true
      version:
        description: "Expected app version, e.g. 1.8.2"
        required: true

permissions:
  contents: write # read draft releases

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            extra: --sharp
          - runner: windows-11-arm
            arch: arm64
            extra: ""
    runs-on: ${{ matrix.runner }}
    name: Windows ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "Notes-Setup-${{ inputs.version }}.exe" --dir dl
      - name: Silent install
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dl\Notes-Setup-${{ inputs.version }}.exe" -ArgumentList "/S" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Notes\Notes.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 | Select-Object FullName; throw "Notes.exe not installed at $exe" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Notes.lnk"
          "start menu shortcut: $(Test-Path $lnk)"
          # The combined installer must install the NATIVE build for this PC.
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $arch = switch ($machine) { 0x8664 { "x64" } 0xAA64 { "arm64" } default { "0x{0:X}" -f $machine } }
          "installed Notes.exe architecture: $arch (expected ${{ matrix.arch }})"
          if ($arch -ne "${{ matrix.arch }}") { throw "installed the $arch build on a ${{ matrix.arch }} machine" }
          "NOTES_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Smoke test
        shell: pwsh
        run: node tests/smoke-test.mjs "$env:NOTES_EXE" "${{ inputs.version }}" --pair --screenshot ${{ matrix.extra }}
      - name: Full feature test (signed in)
        shell: pwsh
        run: node tests/feature-test.mjs "$env:NOTES_EXE" "${{ inputs.version }}"
      - name: Silent uninstall
        if: always()
        shell: pwsh
        run: |
          $u = Join-Path $env:LOCALAPPDATA "Programs\Notes\Uninstall Notes.exe"
          if (Test-Path $u) {
            $p = Start-Process -FilePath $u -ArgumentList "/S" -Wait -PassThru
            Start-Sleep -Seconds 5
            "uninstaller exit code: $($p.ExitCode); app removed: $(-not (Test-Path $env:NOTES_EXE))"
            if (Test-Path $env:NOTES_EXE) { exit 1 }
          } else { "no uninstaller found"; exit 1 }

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            dmg: "Notes-${VERSION}-universal.dmg"
            arch: arm64
          - runner: macos-15-intel
            dmg: "Notes-${VERSION}-universal.dmg"
            arch: x64
    runs-on: ${{ matrix.runner }}
    name: macOS ${{ matrix.arch }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ matrix.dmg }}"; DMG=$(eval echo "$DMG")
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "$DMG" --dir dl
          echo "DMG=dl/$DMG" >> $GITHUB_ENV
      - name: Install from DMG (as a user would)
        run: |
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | awk -F'\t' '{print $NF}')
          ls "$MNT"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$MNT/Notes.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$MNT"
          APP="$RUNNER_TEMP/Applications/Notes.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Downloaded copies are quarantined: must be "rejected" (unidentified
          # developer → Open Anyway), never "damaged"/invalid signature.
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$APP"
          spctl --assess --type execute -vv "$APP" 2>&1 | tee assess.txt || true
          if grep -qiE "damaged|no resources|invalid signature|not signed" assess.txt; then exit 1; fi
          xattr -d com.apple.quarantine "$APP"
          echo "NOTES_EXE=$APP/Contents/MacOS/Notes" >> $GITHUB_ENV
      - name: Smoke test
        run: node tests/smoke-test.mjs "$NOTES_EXE" "$VERSION" --pair --sharp
      - name: Full feature test (signed in)
        run: node tests/feature-test.mjs "$NOTES_EXE" "$VERSION"

  windows-upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: Windows ${{ matrix.arch }} upgrade (app running)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download previous (v1.8.3) and new installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.3 --repo "${{ github.repository }}" --pattern "Notes-Setup-1.8.3.exe" --dir old
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "Notes-Setup-${{ inputs.version }}.exe" --dir new
      - name: Install 1.8.3 and start it
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "old\Notes-Setup-1.8.3.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "old installer exit $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Notes\Notes.exe"
          "old version: $((Get-Item $exe).VersionInfo.ProductVersion)"
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 12
          $running = @(Get-Process -Name Notes -ErrorAction SilentlyContinue).Count
          "Notes processes running before upgrade: $running"
          if ($running -lt 1) { throw "old app did not start" }
      - name: Upgrade with the new installer while the app runs
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "new\Notes-Setup-${{ inputs.version }}.exe" -ArgumentList "/S" -Wait -PassThru
          "new installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "upgrade failed" }
          Start-Sleep -Seconds 3
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Notes\Notes.exe"
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          "installed version after upgrade: $v"
          if (-not $v.StartsWith("${{ inputs.version }}")) { throw "expected ${{ inputs.version }}" }
          Get-Process -Name Notes -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          "NOTES_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Smoke test the upgraded app
        shell: pwsh
        run: node tests/smoke-test.mjs "$env:NOTES_EXE" "${{ inputs.version }}" --screenshot
